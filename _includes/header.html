<header class="site-header">
  <input type="checkbox" id="zones-toggle" class="zones-toggle-checkbox">

  <div class="wrap">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <div class="header-controls">
      <nav class="site-nav">
        {% for item in site.nav_primary %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>

      <label for="zones-toggle" class="icon-btn zones-toggle-btn" aria-label="Abrir menú">&#9776;</label>
    </div>
  </div>

  <label for="zones-toggle" class="zones-overlay" aria-hidden="true"></label>
  <nav class="zones-panel" aria-label="Menú">
    <p class="zones-panel-title">Secciones</p>
    {% for item in site.nav_zones %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
    {% endfor %}

    {% if site.nav_projects %}
      <hr class="zones-panel-sep">
      <p class="zones-panel-title">Otros proyectos</p>
      {% for item in site.nav_projects %}
        <a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.title }} <span class="external-icon" aria-hidden="true">&#8599;</span></a>
      {% endfor %}
    {% endif %}

    <hr class="zones-panel-sep">

    <button type="button" id="theme-toggle" class="icon-btn zones-panel-theme-btn" aria-label="Cambiar entre tema claro y oscuro">
      <span class="theme-toggle-label">Tema oscuro</span>
    </button>
  </nav>
</header>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    var label = btn.querySelector('.theme-toggle-label');
    var media = window.matchMedia('(prefers-color-scheme: dark)');

    function effectiveTheme() {
      var explicit = document.documentElement.getAttribute('data-theme');
      return explicit || (media.matches ? 'dark' : 'light');
    }

    // El botón muestra la acción que va a hacer, no el estado actual.
    function render() {
      label.textContent = effectiveTheme() === 'dark' ? 'Tema claro' : 'Tema oscuro';
    }

    btn.addEventListener('click', function () {
      var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      render();
    });

    media.addEventListener('change', function () {
      if (!localStorage.getItem('theme')) render();
    });

    render();
  })();
</script>
