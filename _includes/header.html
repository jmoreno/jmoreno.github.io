<header class="site-header">
  <div class="wrap">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Abrir menú">&#9776;</label>
      <div class="nav-links">
        {% for item in site.nav %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </div>
    </nav>
  </div>
</header>
