---
layout: default
---
<article class="post snippet">
  <header class="post-header">
    <p class="eyebrow">Snippet</p>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{% include fecha.html date=page.date %}</time>{% endif %}
      {% if page.lenguaje %}&nbsp;·&nbsp;<span class="tag">{{ page.lenguaje }}</span>{% endif %}
    </p>
    {% if page.description %}<p class="snippet-description">{{ page.description }}</p>{% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% include share.html %}
</article>
